name: Update profile stack

on:
  push:
    branches:
      - main
    paths:
      - "README.md"
      - "scripts/**"
      - ".github/workflows/update-profile.yml"
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-profile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Update languages and technology badges
        run: python scripts/update_profile.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PROFILE_OWNER: ${{ github.repository_owner }}

      - name: Commit profile changes
        run: |
          if git diff --quiet -- README.md; then
            echo "No profile changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: update profile stack"
          git push
